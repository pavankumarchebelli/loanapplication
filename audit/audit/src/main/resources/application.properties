spring.application.name=audit
# --- server ---
server.port=8084

# --- datasource (PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/NexaBankDB
spring.datasource.username=pavan
spring.datasource.password=admin

# --- JPA/Hibernate ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- logging ---
# include correlation id from MDC (set by the CorrelationIdAspect)
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId}] %logger{36} - %msg%n
logging.level.com.nexa.audit=INFO
logging.level.org.hibernate.SQL=WARN

# --- custom app flag used by the AOP @Value("${app.env:dev}") ---
app.env=dev

# Turn Flyway off (even if the jar is still around)
spring.flyway.enabled=false
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# Make sure Spring doesn't try to run schema.sql/data.sql automatically unless you want it
spring.sql.init.mode=never
